# Lokal utvikling: bygger images fra kildekoden.
# For produksjon på desktopen, se compose.prod.yml.
name: nb-transcribe-dev

networks:
  internal_app: {}

volumes:
  db-data: {}

services:
  backend:
    build: ./backend
    container_name: nb-transcribe-dev-backend
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - DATABASE_URL=postgresql+psycopg://nbtranscribe:nbtranscribe@db:5432/nbtranscribe
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal_app]

  frontend:
    build: ./frontend
    container_name: nb-transcribe-dev-frontend
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal_app]

  db:
    image: postgres:16
    container_name: nb-transcribe-dev-db
    environment:
      POSTGRES_DB: nbtranscribe
      POSTGRES_USER: nbtranscribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nbtranscribe}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal_app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbtranscribe -d nbtranscribe"]
      interval: 5s
      timeout: 5s
      retries: 10
