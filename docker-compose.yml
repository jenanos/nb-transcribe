networks:
  internal_app: {}
  cf_edge:
    external: true

volumes:
  db-data: {}

services:
  backend:
    build: ./backend
    container_name: nb-transcribe-backend
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql+psycopg://nbtranscribe:nbtranscribe@db:5432/nbtranscribe
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      - db
    networks: [internal_app]

  frontend:
    build: ./frontend
    container_name: nb-transcribe-frontend
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    networks: [internal_app, cf_edge]

  db:
    image: postgres:16
    container_name: nb-transcribe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nbtranscribe
      POSTGRES_USER: nbtranscribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nbtranscribe}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal_app]
